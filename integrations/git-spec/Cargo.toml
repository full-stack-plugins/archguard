[package]
name = "archguard-git-spec"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
archguard = { path = "../..", version = "=0.1.0" }
guardengine = { path = "../../../guardengine", version = "=0.1.0" }
