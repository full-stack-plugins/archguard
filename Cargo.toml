[package]
name = "archguard"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Architecture dependency analysis for Partme Guard"
license = "Apache-2.0"

[dependencies]
guard-install = { path = "../guardengine/crates/guard-install" }
guardengine = { path = "../guardengine" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.21.1"
sha2 = "0.10"
tree-sitter = "=0.25.10"
tree-sitter-java = "=0.23.5"

[dev-dependencies]
tempfile = "3"
