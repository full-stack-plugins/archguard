[package]
name = "archguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "ArchGuard architecture declaration analysis and candidate-bound evidence"
license = "Apache-2.0"

[dependencies]
guardengine = { path = "../guardengine" }
gitguard = { path = "../gitguard", version = "=0.1.0" }
specguard = { path = "../specguard", version = "=0.1.0" }
serde_json = "1"
serde = { version = "=1.0.228", features = ["derive"] }
time = { version = "=0.3.44", features = ["formatting"] }
tempfile = "=3.23.0"
sha2 = "0.10"

# Fixed parser/process boundary dependencies for the declaration runner.
toml = "=0.8.23"
libc = "=0.2.177"
glob = "=0.3.3"
