apiVersion: guard.partme.ai/v1alpha1
kind: GuardContract
metadata:
  id: agent-job-boundary
  revision: "1"
spec:
  rules:
    - id: AGJ-ARCH-001
      description: "Agent Job must not depend on Agent SaaS"
      enforcement: enforce
      assertion:
        type: forbid_relation
        subject: agent-job
        predicate: depends_on
        object: agent-saas
