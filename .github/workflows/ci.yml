name: ArchGuard CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: archguard
          persist-credentials: false
      # Core consumes only the reviewed vendored GE source closure.
      - name: Prepare pinned core engine
        run: cp -R archguard/vendor/guardengine guardengine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: archguard
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: archguard
      - name: Test
        run: cargo test --all-targets
        working-directory: archguard
