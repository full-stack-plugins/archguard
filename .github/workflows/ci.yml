name: ArchGuard CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: archguard
      # Pin the complete sibling-source graph until independent packages are released.
      - uses: actions/checkout@v4
        with:
          repository: full-stack-plugins/guardengine
          ref: 34f07583f2e4123dc1b2bb4efa489c3bf72b03d6
          path: guardengine
      - uses: actions/checkout@v4
        with:
          repository: full-stack-plugins/gitguard
          ref: 601b8ebd4e636e566398ed393d1a11f9413cbdb2
          path: gitguard
      - uses: actions/checkout@v4
        with:
          repository: full-stack-plugins/specguard
          ref: 8fc3f9b0df0df388b8f4ec6cdedab64f89d1d033
          path: specguard
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: archguard
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: archguard
      - name: Test
        run: cargo test --all-targets
        working-directory: archguard
      - name: Diagnose denied Git process in isolated fixture
        if: failure()
        working-directory: archguard
        run: |
          set +e
          strace -f -e trace=process,network -o "$RUNNER_TEMP/archguard-git-process.trace" \
            cargo test --locked --offline --test attempt_concurrency \
            late_old_allow_cannot_replace_new_block_for_actual_git_candidates -- --exact
          fixture_status=$?
          tail -n 160 "$RUNNER_TEMP/archguard-git-process.trace"
          exit "$fixture_status"
